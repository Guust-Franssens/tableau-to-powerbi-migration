name: issue-intake-checks

on:
  pull_request:
    paths:
      - .github/workflows/issue-intake*
      - .github/aw/**
      - .gitattributes
  push:
    branches: [master]
    paths:
      - .github/workflows/issue-intake*
      - .github/aw/**
      - .gitattributes

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned workflow compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw --pin v1.0.1
      - name: Validate source and generated workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh aw compile issue-intake --strict --validate --no-check-update
          git diff --exit-code
