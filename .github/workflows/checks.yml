name: checks

# Runs the same gates CONTRIBUTING.md tells you to run locally. Without this, the
# `set_data_folder.py --check` privacy gate was *documented* as a CI gate but never actually ran -
# and a real username leaked into committed build artifacts unnoticed.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Drift signal for engine-dependent tests: current upstream engine, allowed to go red.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-dotnet@v4
        # The TMDL oracle (tools/tmdl_oracle) hands each semantic model to TmdlSerializer - the
        # parser Power BI Desktop itself uses - instead of re-implementing the TMDL grammar in
        # Python for a third time (issue #254). AMO's netcore package is genuinely cross-platform:
        # measured 2026-08-30, the helper builds and deserializes on Ubuntu 24.04 under .NET 9, so
        # the gate keeps full teeth on this runner. Without this step the data-model gate would
        # exit 3 (unassessable) rather than passing quietly.
        with:
          dotnet-version: '9.0.x'

      - name: Install dependencies
        # uv.lock is deliberately gitignored (it resolves to internal package-feed URLs), so this
        # resolves fresh rather than restoring a committed lockfile.
        run: uv sync --all-extras

      - name: Lint (ruff)
        # `.github/skills/*/scripts` is code that MOVED out of `scripts/` to make each skill a
        # self-contained copyable unit; without naming it here it would be linted by nobody.
        # `conftest.py` is the repo-root parallel-run guard (issue #387) - it sits above every lint
        # root below, so it needs naming for the same reason.
        # Keep in step with `testpaths` in pyproject.toml.
        run: |
          uv run ruff format --check conftest.py scripts tests .github/skills
          uv run ruff check conftest.py scripts tests .github/skills

      - name: Static analysis (pylint)
        # Three invocations, not one: `scripts/probe_desktop_query.py` is a forwarding shim with the
        # same module name as the bundled script it forwards to, so a single `pylint scripts
        # .github/skills/...` puts both on the path and resolves the import to the shim
        # (E0611 no-name-in-module). That collision forces `scripts` and pbip-model-refresh/scripts
        # apart; powerbi-ai-readiness/scripts is separate by the one-root-per-invocation convention.
        # Tests are not held to 10.00/10; the toolkit code is - and `conftest.py` is toolkit code
        # that gates every parallel run (issue #387), so it is held to it too. It is a fourth
        # invocation for the same one-root-per-invocation reason.
        run: |
          uv run pylint scripts
          uv run pylint .github/skills/pbip-model-refresh/scripts
          uv run pylint .github/skills/powerbi-ai-readiness/scripts
          uv run pylint conftest.py

      - name: Tests
        run: T2P_ENGINE_TESTS_NOT_CHECKED_REASON=covered-by-pinned-engine-integration-job uv run pytest -q

      - name: Migration spec contract gate
        run: uv run python scripts/validate_spec.py --all --check

      - name: Privacy gate - no absolute user paths in tracked files
        run: uv run python scripts/set_data_folder.py --check

      - name: Data model gate - catch M and TMDL structural defects first
        # The TMDL oracle is mandatory by default: if it cannot run, this exits 3 (unassessable)
        # rather than 0, so "we could not check" can never be read as "clean".
        run: uv run python scripts/check_datamodel.py --all

      - name: Navigation index covers agent-facing docs and gates
        run: uv run python scripts/check_navigation_index.py

      - name: Shipped capabilities reach agents
        run: uv run python scripts/check_agent_capabilities.py

      - name: Shared conventions reach every agent (a subagent sees ONLY its persona)
        run: uv run python scripts/sync_agent_conventions.py --check

      - name: AI-readiness report (advisory - a visible backlog, not a blocker)
        # Deliberately NOT --strict: the legacy models predate this layer, so a repo-wide gate would
        # fail every build and get switched off. The enforcing form is scoped to one model
        # (`--check --strict --model <*.SemanticModel>`) and belongs in the agent hand-off, per
        # .github/skills/powerbi-ai-readiness/SKILL.md.
        run: uv run python scripts/set_ai_instructions.py --check

  engine-integration:
    runs-on: ubuntu-latest
    env:
      EXPECTED_ENGINE_VERSION: '2.356.0'
      PINNED_ENGINE_REF: '962d16cfe6f711622d419a567f992da8d90c8781'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Yarbrdab000/tableau-fabric-skills
          ref: 962d16cfe6f711622d419a567f992da8d90c8781
          path: _engine-source

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install pinned deterministic engine
        run: |
          mkdir -p "$HOME/.copilot/installed-plugins/tableau-collection/tableau-fabric-skills"
          cp -a _engine-source/. "$HOME/.copilot/installed-plugins/tableau-collection/tableau-fabric-skills/"
          uv run python scripts/engine_source.py --json
          test "$(cat "$HOME/.copilot/installed-plugins/tableau-collection/tableau-fabric-skills/skills/tableau-migration/VERSION")" = "$EXPECTED_ENGINE_VERSION"

      - name: Tests (engine-dependent, pinned engine)
        run: T2P_REQUIRE_ENGINE_TESTS=1 uv run pytest -q tests/test_issue_424_chart_type_pin.py tests/test_dax_oracle_server.py tests/test_upstream_repro_pins.py

  engine-drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Yarbrdab000/tableau-fabric-skills
          ref: main
          path: _engine-source

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install latest deterministic engine
        run: |
          mkdir -p "$HOME/.copilot/installed-plugins/tableau-collection/tableau-fabric-skills"
          cp -a _engine-source/. "$HOME/.copilot/installed-plugins/tableau-collection/tableau-fabric-skills/"
          uv run python scripts/engine_source.py --json
          echo "Current engine version: $(cat "$HOME/.copilot/installed-plugins/tableau-collection/tableau-fabric-skills/skills/tableau-migration/VERSION")"

      - name: Tests (engine-dependent, latest engine drift signal)
        run: T2P_REQUIRE_ENGINE_TESTS=1 uv run pytest -q tests/test_issue_424_chart_type_pin.py tests/test_dax_oracle_server.py tests/test_upstream_repro_pins.py

  # The main checks job runs on Linux. The pbip-model-refresh bundle does not: `SKILL.md` line 8 says
  # "Windows only." That mismatch is not cosmetic - it makes the Linux job STRUCTURALLY incapable of
  # failing on this bundle's most important code path.
  #
  # Why: `_credential_state` guards on `os.name != "nt"` and returns a bare `CredentialDetection()`
  # off Windows. Every field of that defaults to None, which is byte-identical to the state a
  # healthy, windowed, unblocked Power BI Desktop produces. So off Windows the detector does not
  # report "I cannot inspect this" - it reports "everything is fine", and every caller believes it.
  #
  # Measured (issue #182, PR #168): 17 tests drove `main(["--pid", "111", ...])` against a pid that
  # does not exist. On ubuntu-latest that read as healthy and CI went GREEN; on Windows the same
  # tests produced a real `process_gone` detection and exited 1. CI was green on a branch that was
  # red on every machine that can actually run the code, and only a human reproducing it locally
  # found out.
  #
  # Deliberately scoped to the bundle's own tests, NOT the whole suite: this job exists to cover the
  # one platform the bundle runs on, not to duplicate the Linux gates on a slower runner. Measured
  # 26.41s for 164 tests locally, so the marginal cost is small.
  #
  # This does not make the bundle fully covered - `_credential_state`'s own wiring to the real Win32
  # primitives is still only exercised here, and the non-Windows return value's MEANING is still
  # untested by construction. Issue #182 tracks those; a Windows runner is the half that no amount of
  # dependency injection can substitute for.
  windows-bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Tests (pbip-model-refresh bundle, on the platform it actually runs on)
        run: uv run pytest -q .github/skills/pbip-model-refresh/tests/

      # The root `conftest.py` deselects `gui` (window-spawning) tests in every tier, so an
      # operator's desktop is never hijacked (issue #447). That protection is worthless if NOBODY
      # runs them: issue #435 is this repo's own record of 15 engine tests skipping silently in CI,
      # where a skip was being read as a pass. A hosted Windows runner has no one to interrupt, so
      # this is where they belong.
      #
      # ⚠️ TWO things about this command are load-bearing, and dropping either re-opens the hole:
      #
      #   `--run-gui` is the OPT-IN. `-m gui` alone selects them and the hook then deselects them
      #   again, so the step would report "no tests ran" and stay green. The flag composes with the
      #   marker expression instead of replacing it, which is the whole reason the exclusion moved
      #   out of `addopts` (a caller's `-m` REPLACED that, and `-m "not slow"` re-ran every window).
      #
      #   NO PATH ARGUMENT. `testpaths` then applies, so this covers `tests/` AND `.github/skills/`
      #   - the entire repository's gui surface. The previous version named the bundle directory, so
      #   a gui test added anywhere else would have been excluded by default and run by nothing.
      #   `tests/test_gui_marker_gate.py` enforces that by collecting the repo's gui tests and
      #   checking every one of them is reachable from this command.
      - name: Tests (GUI, opt-in - the real UI-Automation path the credential probe depends on)
        run: uv run pytest -q --run-gui -m gui
