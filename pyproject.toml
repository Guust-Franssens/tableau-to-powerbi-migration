[project]
name = "tableau-to-pbi-migration"
version = "0.1.0"
description = "AI-assisted Tableau -> Power BI / Fabric migration toolkit"
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.2",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
extract = [
    "tableauhyperapi>=0.0.19315",
]
screenshots = [
    "playwright>=1.44",
]
showcase = [
    "pillow>=10.3",
]
snowflake = [
    "snowflake-connector-python>=3.12",
]
server = [
    "tableauserverclient>=0.34",
]
dev = [
    "pytest>=8.2",
    # Parallel test loop (issue #387): measured 740s serial -> ~215s with `-n auto --dist loadfile`
    # on 22 logical cores. A dev dependency, not an optional nicety, because every agent works in its
    # own `git worktree` + `uv sync` venv - anything not declared here is absent from all of them.
    "pytest-xdist>=3.6",
    "ruff>=0.6",
    "pylint>=3.2",
]

# This is a SCRIPT toolkit, not an importable library: everything runs as `python scripts/<x>.py`.
# Without this, setuptools' flat-layout auto-discovery tries to package the top-level content folders
# (examples/, migrations/) and fails with "Multiple top-level packages discovered in a
# flat-layout", which breaks `uv sync` and therefore pytest for everyone.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
# pytest skips dot-directories by default (`norecursedirs` includes `.*`), so the tests bundled
# inside `.github/skills/<skill>/tests/` were collected by NOBODY - the code moved out of `tests/`
# would have gone silently ungated. Naming the roots explicitly is what makes a self-contained skill
# folder a real gate rather than a claim. `ruff`/`pylint` need the same treatment in
# `.github/workflows/checks.yml`; keep the two lists in step.
testpaths = ["tests", ".github/skills"]
markers = [
    "slow: joined offline Tableau-to-Fabric mock integration tests",
    # `slow` is about DURATION; this is about EXCLUSIVITY. A test earns `serial` when it contends for a
    # singleton external resource - a real Power BI Desktop instance, its UI-Automation tree, a live
    # credential dialog - so two of them running at once degrade each other. Measured (issue #387):
    # concurrent live suites turned one harvest into `DIALOG_UNREADABLE` and made another test SKIP.
    # See docs/parallel-test-loop.md for the tier that runs these on their own.
    "serial: contends for a singleton external resource; must not run beside another such test",
    # Different hazard, same tier. A `timing` test asserts a WALL-CLOCK budget, so it measures the
    # machine as much as the code. Measured (issue #387): under 22 xdist workers,
    # `test_refresh_main_returns_credential_missing_fast_at_t0` took 0.941s against a 0.5s budget on
    # an operation that takes 0.03s serially - a 31x inflation of a very short measured window, so
    # widening the bound is not a fix. Every SUB-SECOND budget test must carry this (gated from the
    # suite's AST); a larger budget earns it once measured to fail, as the 10s process-rendezvous
    # barrier in test_check_migration_progress.py did. Tests carry the marker in their own source
    # (and the pbip-model-refresh bundle registers it in its own conftest) so it survives a copy.
    "timing: asserts a wall-clock budget, so a saturated box fails it",
]

[tool.ruff]
exclude = [
    ".bzr", ".direnv", ".eggs", ".git", ".git-rewrite", ".hg",
    ".ipynb_checkpoints", ".mypy_cache", ".nox", ".pants.d",
    ".pyenv", ".pytest_cache", ".pytype", ".ruff_cache", ".svn",
    ".tox", ".venv", ".vscode", "__pypackages__", "_build",
    "buck-out", "build", "dist", "node_modules", "site-packages", "venv",
    # Per-migration generated validation scripts are committed ARTIFACTS, not source. Linting them made
    # the documented `ruff check .` rewrite ~77 lines across committed examples. `migrations` covers
    # both nested trees (the user's own workbook and data-source migrations).
    "examples",
    "migrations",
    # Ruff formats fenced Python in Markdown. Exclude only the documentation trees CI does not lint;
    # keep Markdown under scripts/tests/.github/skills covered by the CI ruff roots.
    "docs/**/*.md",
    ".github/pbi.kb/**/*.md",
]
force-exclude = true
line-length = 120
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.pylint.main]
fail-under = 10
ignore = ["CVS"]
ignore-patterns = ["^\\.#"]
jobs = 1
limit-inference-results = 100
persistent = true
py-version = "3.11"
extension-pkg-allow-list = ["lxml.etree"]
# `scripts/` is an import root at RUNTIME - tests and skill scripts do `sys.path.insert(0, scripts)`
# before `import engine_source` - but pylint does not execute that, so it reported E0401 import-error
# on every such module. Not cosmetic: pylint then prints a healthy-looking score and still exits
# non-zero, and the repo rule is to judge it by EXIT CODE, so a changed file looks clean and fails.
#
# ⚠️ `source-roots` is the wrong lever and was measured to make things worse: it only decides the
# package NAME of the analysed files, never the import search path, so it left the E0401 in place
# AND re-labelled `.github/skills/*/scripts/*.py` as members of a deep `.github.skills...` package,
# which broke their sibling-by-bare-name imports (that invocation went exit 0 -> exit 2).
# `init-hook` does affect `sys.path`. Measured with it in place: all four CI pylint invocations plus
# `tests/` stay at their prior exit codes, including the pbip-model-refresh shim collision the CI
# comment warns about. CWD-relative, which is what every documented command and CI itself uses; from
# another directory it degrades to today's behaviour rather than misreporting.
init-hook = 'import os, sys; sys.path.insert(0, os.path.join(os.getcwd(), "scripts"))'

[tool.pylint.format]
max-line-length = 120
max-module-lines = 1200

[tool.pylint."messages control"]
# TODO comments are a deliberate scope-tracking practice in this repo, not a defect.
# duplicate-code (R0801): scripts/ holds INDEPENDENT one-shot CLI tools that intentionally keep small
# local helpers self-contained (e.g. the sibling carousel/showcase image generators) rather than
# coupling through a shared module. Without this, the documented `pylint scripts` command fails the
# fail-under = 10 gate.
disable = ["fixme", "duplicate-code"]

[tool.pylint.basic]
argument-naming-style = "snake_case"
attr-naming-style = "snake_case"
class-attribute-naming-style = "any"
class-const-naming-style = "UPPER_CASE"
class-naming-style = "PascalCase"
const-naming-style = "UPPER_CASE"
docstring-min-length = -1
function-naming-style = "snake_case"
good-names = ["i", "l", "j", "k", "ex", "Run", "_", "df", "f", "k", "v"]
inlinevar-naming-style = "any"
method-naming-style = "snake_case"
module-naming-style = "snake_case"
no-docstring-rgx = "^_"
property-classes = ["abc.abstractproperty"]
variable-naming-style = "snake_case"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
